services:
  nanobot:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        UV_BASE_IMAGE: ${UV_BASE_IMAGE:-ghcr.1ms.run/astral-sh/uv:python3.12-bookworm-slim}
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-docker.1ms.run/library/node:20-bookworm-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: nanobot:qwen
    container_name: nanobot
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${NANOBOT_DATA_DIR:-./nanobot-data}:/root/.nanobot
    command: ["gateway"]
